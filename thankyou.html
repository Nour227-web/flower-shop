<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شكراً لطلبك | رونق</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

</head>

<body>

    <!-- Thank You Page -->

    <section class="thank-you-section">

        <div class="thank-you-card">

            <!-- Logo -->
            <div class="thank-you-logo">
                <img src="images/logo.jpg" alt="رونق">
            </div>

            <!-- Flower -->
            <div class="thank-you-icon">
                🌷
            </div>

            <!-- Title -->
            <h1>شكراً لطلبك!</h1>

            <!-- Subtitle -->
            <h3>تم استلام طلبك بنجاح</h3>

            <!-- Message -->
            <p>
                شكراً لاختيارك <strong>رونق</strong> 🌸
                <br>
                تم تسجيل طلبك بنجاح.
                <br>
                يرجى مراجعة رسالة <strong>WhatsApp</strong>
                لمعرفة تفاصيل طلبك ومعلومات التوصيل.
            </p>

            <!-- WhatsApp Message -->
            <div class="order-message">
                <span>💬</span>
                <div>
                    <strong>راجع رسالتك</strong>
                    <small>ستجد تفاصيل طلبك على WhatsApp</small>
                </div>
            </div>

            <!-- Back Button -->
            <a href="index.html" class="thank-you-btn">
                العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </section>


    <script src="assets/js/bootstrap.bundle.min.js"></script>

</body>

</html>
